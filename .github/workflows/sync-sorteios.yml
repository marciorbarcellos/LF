name: Sincronizar sorteios

on:
  schedule:
    # Sorteios às 20h (Brasília = 23h UTC). Tenta de 20 em 20 min entre 20h e 23h BRT.
    - cron: "*/20 23 * * *"
    - cron: "*/20 0,1 * * *"
    # Rede de segurança: uma passada ao meio-dia (BRT) para pegar atrasos de publicação.
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-sorteios.yml"
      - "scripts/sync-sorteios.mjs"

permissions:
  contents: write

concurrency:
  group: sync-sorteios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar novos concursos na Caixa
        run: node scripts/sync-sorteios.mjs

      - name: Commitar e enviar se houve mudança
        run: |
          if git diff --quiet -- SORTEIO/sorteios.json; then
            echo "Nenhum concurso novo."
            exit 0
          fi
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add SORTEIO/sorteios.json
          git commit -m "Atualiza resultados dos sorteios [skip ci]"
          git pull --rebase origin main
          git push origin main
